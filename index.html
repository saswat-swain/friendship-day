<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendship Surprise</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="stars"></div>

<div class="container">

    <div class="card">

        <h1>Hello friends❤️</h1>

        <h2>Happy Friendship Day</h2>

        <p>
            Every friendship has a story...
            Today I have a small surprise for you.
        </p>

        <button id="giftBtn">
            🎁 Open Surprise
        </button>

    </div>

</div>

<!-- Surprise Section -->
<section id="surprise">

    <div class="gift-box" id="gift">
        🎁
    </div>

    <h1 class="friend-title">
        ❤️ U all friends
    </h1>

    <p class="message">
        A true friend is one of the greatest blessings in life.
        Thank you for being with me through every smile and every challenge.
    </p>

    <div class="gallery">

        <img src="friendship 1.jpeg" alt="photo1">

        <img src="friendship 2.jpeg" alt="photo2">

        <img src="4.jpeg" alt="photo3">

        <img src="fri.jpeg" alt="photo4">

        <img src="5.jpeg" alt="photo5">


    </div>

</section>
<script src="script.js"></script>
</body>
</html>
